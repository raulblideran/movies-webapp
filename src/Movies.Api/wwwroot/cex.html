<!doctype html>
<html lang="en" class="min-h-screen">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>CeX Stock Tracker</title>
        <link rel="icon" href="favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
        <link rel="apple-touch-icon" href="apple-touch-icon.png" />
        <meta name="theme-color" content="#0a0e27" />
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            primary: "#00d9ff",
                            "primary-dark": "#0e7490",
                            success: "#00ff88",
                        },
                        animation: {
                            fadeIn: "fadeIn 0.3s ease",
                            slideUp: "slideUp 0.3s ease",
                        },
                        keyframes: {
                            fadeIn: { "0%": { opacity: "0" }, "100%": { opacity: "1" } },
                            slideUp: {
                                "0%": { opacity: "0", transform: "translateY(50px)" },
                                "100%": { opacity: "1", transform: "translateY(0)" },
                            },
                        },
                    },
                },
            };
        </script>
        <style>
            :root {
                --dialog-tint: #0f1a2e;
            }
            body {
                background: linear-gradient(135deg, #0a0e27 0%, #16213e 100%);
                background-attachment: fixed;
            }
        </style>
    </head>
    <body class="min-h-screen text-gray-100 flex flex-col">
        <nav
            id="topBar"
            class="relative z-40  bg-gradient-to-br from-white/5 to-white/10 backdrop-blur-md border-b border-white/10"
        >
            <div class="px-4 sm:px-6 py-2.5 flex flex-col sm:flex-row items-center justify-between gap-2 text-sm">
                <div class="flex items-center gap-1">
                    <a href="/" class="px-3 py-1.5 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-colors">🎬 Collection</a>
                    <a href="/cex" aria-current="page" class="px-3 py-1.5 rounded-lg bg-white/10 text-white font-semibold">🛒 CeX Tracker</a>
                </div>
                <div id="authArea" class="text-xs text-gray-400 text-center sm:text-right"></div>
            </div>
            <div class="h-[2px] bg-gradient-to-r from-cyan-400 via-blue-500 to-cyan-400"></div>
        </nav>
        <div class="px-6 py-8 flex-1">
            <!-- Store picker + sort -->
            <div class="relative mb-6 flex items-center justify-center gap-4 flex-wrap">
                <div class="relative w-full sm:w-96">
                    <input
                        type="text"
                        id="storeSearch"
                        class="bg-slate-800/50 border border-cyan-500/30 rounded-xl px-4 py-3 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500 transition-all w-full"
                        placeholder="Search stores..."
                        autocomplete="off"
                    />
                    <div
                        id="storeDropdown"
                        class="hidden absolute top-full left-0 right-0 mt-2 bg-slate-800 border border-cyan-500/30 rounded-xl shadow-2xl max-h-80 overflow-y-auto z-50"
                    ></div>
                </div>
                <button
                    id="sortBtn"
                    class="bg-slate-800/50 border border-cyan-500/30 rounded-xl px-4 py-3 text-sm font-medium hover:bg-cyan-500/10 hover:border-cyan-500 transition-all whitespace-nowrap"
                >
                    Sort by Distance
                </button>
            </div>

            <!-- Signed-in only: paste a link to start tracking it -->
            <div id="adminBar" class="hidden max-w-2xl mx-auto mb-8"></div>

            <!-- Grid of cards -->
            <div
                id="grid"
                class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-7 2xl:grid-cols-10 gap-6"
            ></div>
            <p id="emptyState" class="hidden text-center text-gray-400 mt-16">
                Nothing tracked yet.
            </p>
        </div>

        <!-- Stores modal -->
        <div
            id="modalOverlay"
            class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4"
        >
            <div
                class="bg-slate-800 rounded-2xl border border-cyan-500/30 shadow-2xl max-w-2xl w-full max-h-[80vh] overflow-hidden"
            >
                <div class="flex items-center justify-between p-6 border-b border-slate-700">
                    <h2 id="modalTitle" class="text-xl font-bold text-white"></h2>
                    <button
                        id="modalClose"
                        class="w-8 h-8 rounded-lg bg-slate-700 hover:bg-red-500/20 hover:text-red-400 transition-colors flex items-center justify-center text-2xl"
                    >
                        ×
                    </button>
                </div>
                <div id="modalBody" class="p-6 overflow-y-auto max-h-[60vh] space-y-3"></div>
            </div>
        </div>

        <!-- Loading overlay -->
        <div
            id="loadingOverlay"
            class="fixed inset-0 bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 z-50 flex flex-col items-center justify-center transition-opacity duration-300"
        >
            <div class="relative">
                <div
                    class="w-20 h-20 border-4 border-cyan-500/20 border-t-cyan-500 rounded-full animate-spin"
                ></div>
                <div
                    class="absolute inset-0 w-20 h-20 border-4 border-transparent border-r-blue-500 rounded-full animate-spin"
                    style="animation-duration: 1.5s; animation-direction: reverse"
                ></div>
            </div>
            <div class="mt-6 text-cyan-400 font-semibold text-lg animate-pulse">
                Loading CeX Products...
            </div>
        </div>

        <footer
            id="footer"
            class="relative mt-16 bg-gradient-to-br from-white/5 to-white/10 backdrop-blur-md border-t border-white/10"
        >
            <div class="h-[3px] bg-gradient-to-r from-cyan-400 via-blue-500 to-cyan-400"></div>
            <div
                class="px-6 py-5 flex flex-col sm:flex-row items-center justify-between gap-3 text-sm"
            >
                <div class="flex items-center gap-2 text-gray-300 sm:flex-1">
                    <span class="text-lg">🛒</span>
                    <span
                        >Designed by
                        <span
                            class="font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500"
                            >Raul</span
                        ></span
                    >
                </div>
                <div class="sm:flex-1 flex items-center gap-3 sm:justify-end">
                    <span
                        class="font-mono text-xs px-2.5 py-1 rounded-md bg-black/30 border border-white/10 text-gray-400"
                        title="Build date (yyMMdd)"
                        >v{{version}}</span
                    >
                </div>
            </div>
        </footer>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
        <script src="js/auth.js"></script>
        <script src="js/cex.js"></script>
    </body>
</html>
