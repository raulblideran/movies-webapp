<!doctype html>
<html lang="en" data-asset-version="{{stamp}}">
    <head>
        <meta charset="UTF-8" />
        <meta name="robots" content="noindex" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Watches</title>
        <link rel="icon" href="favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
        <link rel="apple-touch-icon" href="apple-touch-icon.png" />
        <meta name="theme-color" content="#240509" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="Movies" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;1,400&family=Big+Shoulders+Display:wght@600;800;900&display=swap"
        />
        <link rel="stylesheet" href="css/site.css" />
        <script>
            // Load the saved theme before first paint (js/theme.js owns the picker).
            (function () {
                var t = new URLSearchParams(location.search).get("theme");
                try {
                    if (t) localStorage.setItem("theme", t);
                    else t = localStorage.getItem("theme");
                } catch (e) {}
                if (t && t !== "house" && /^[a-z-]+$/.test(t)) {
                    document.documentElement.dataset.theme = t;
                    document.write('<link rel="stylesheet" id="themeCss" href="css/themes/' + t + '.css?v={{stamp}}">');
                }
            })();
        </script>
    </head>
    <body>
        <nav class="topbar" id="topBar" aria-label="Site">
            <div class="topbar-nav">
                <a href="/">Watchlog</a>
                <a href="/watchlist">Watchlist</a>
                <a href="/releases">Releases</a>
                <a href="/stats">Stats</a>
                <a href="/cex">CeX<span class="nav-long"> tracker</span></a>
            </div>
            <div class="topbar-end">
                <div id="themeSlot"></div>
                <div id="authArea" class="account"></div>
            </div>
        </nav>

        <header class="hero hero-compact">
            <div class="hero-art" aria-hidden="true"></div>
            <div class="marquee">
                <div class="marquee-board">
                    <p class="hero-tagline">Every viewing</p>
                    <h1 class="hero-title">Watches</h1>
                    <dl class="hero-stats" id="stats">
                        <div class="stat stat-placeholder"><dt>watches</dt><dd>000</dd></div>
                    </dl>
                </div>
            </div>
        </header>

        <main class="page">
            <div id="signedOut" class="empty hidden">
                <h2>Sign in to see the watches</h2>
                <p class="muted">This page is for editing: every watch of every title, to date, change or delete.</p>
                <button type="button" class="btn btn-primary" data-login>Sign in</button>
            </div>

            <div id="watchesUi" class="hidden">
                <div class="toolbar">
                    <div class="toolbar-row">
                        <div class="title-filter">
                            <label class="search">
                                <span class="sr-only">Filter by title, or search the notes</span>
                                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                    <circle cx="8.5" cy="8.5" r="6" />
                                    <path d="m13 13 5 5" stroke-linecap="round" />
                                </svg>
                                <input type="search" class="input" id="watchSearch" autocomplete="off" placeholder="Filter by title, or search the notes…" role="combobox" aria-expanded="false" aria-controls="watchTitleList" />
                            </label>
                            <ul class="title-pick-list hidden" id="watchTitleList" role="listbox"></ul>
                        </div>
                        <span class="result-count" id="watchCount" aria-live="polite"></span>
                        <label class="release-sort"><span class="sr-only">Year</span>
                            <select class="input" id="watchYear" data-watch-year></select>
                        </label>
                        <button type="button" class="btn btn-primary" id="addWatch">+ Add a watch</button>
                    </div>
                    <div class="toolbar-row">
                        <div class="chips" id="watchShow" role="group" aria-label="Show"></div>
                        <div id="pickedTitle" class="picked-title hidden"></div>
                    </div>
                </div>
                <div id="watchesTable"></div>
            </div>
        </main>

        <div class="toast toast-error hidden" id="error" role="alert"></div>
        <div class="toast hidden" id="success" role="status"></div>

        <footer class="footer" id="footer">
            <span>Designed by <strong>Raul</strong></span>
            <span id="photoCredit" class="photo-credit"></span>
            <span class="version" title="Build date and time (yyMMdd.HHmm, UK time)">v{{version}}</span>
        </footer>

        <script src="js/theme.js"></script>
        <script src="js/pwa.js"></script>
        <script src="js/select.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/shelf.js"></script>
        <script src="js/lists.js"></script>
        <script src="js/datepicker.js"></script>
        <script src="js/watch-dialog.js"></script>
        <script src="js/watches-page.js"></script>
    </body>
</html>
