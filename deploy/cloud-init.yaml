#cloud-config
# First-boot setup for the IONOS VPS (Rocky Linux 10).
# Paste into "Advanced Options → User Data" (Script Type: Cloud Config) when reinstalling.
#
# Deliberately minimal: an admin user "raul" who signs in with an SSH key only, and root and
# password SSH logins disabled. Firewall, updates and the app are configured afterwards over SSH
# (deploy/harden-server.sh), where each step's result is visible.

users:
  - name: raul
    groups: [wheel]
    shell: /bin/bash
    # Key-only account (no password), so sudo must not prompt for one.
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDV2ZnP+twqB8KGYwQXam4W5yuuIGstRhYKQ8ZEsGsCK raul.blideran@hotmail.com

disable_root: true
ssh_pwauth: false

write_files:
  - path: /etc/ssh/sshd_config.d/10-hardening.conf
    permissions: "0600"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      MaxAuthTries 3
      LoginGraceTime 20
      X11Forwarding no
      AllowUsers raul
