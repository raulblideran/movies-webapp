name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test MoviesWebapp.slnx --logger "trx;LogFileName=results.trx"
      # Failing tests as annotations, so they show on the run's summary page without opening the log.
      - name: List failed tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          for f in glob.glob("**/TestResults/*.trx", recursive=True):
              for r in ET.parse(f).getroot().iterfind(".//t:UnitTestResult", ns):
                  if r.get("outcome") == "Failed":
                      m = r.find(".//t:Message", ns)
                      text = " ".join(((m.text if m is not None else "") or "").split())[:500]
                      print(f"::error title={r.get('testName')}::{text}")
          PY

  image:
    # The server's podman auto-update picks up :latest within ~2 minutes.
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: runtime
          push: true
          tags: |
            ghcr.io/raulblideran/movies-webapp:latest
            ghcr.io/raulblideran/movies-webapp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
